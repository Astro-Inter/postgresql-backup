name: Backup PostgreSQL

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions usa UTC. 06:17 UTC corresponde a 03:17 em America/Sao_Paulo.
    - cron: "17 6 * * *"

permissions:
  contents: read

concurrency:
  group: backup-postgresql-astro
  cancel-in-progress: false

jobs:
  backup:
    name: Gerar e armazenar backup
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      AIVEN_PG_HOST: ${{ secrets.AIVEN_PG_HOST }}
      AIVEN_PG_PORT: ${{ secrets.AIVEN_PG_PORT }}
      AIVEN_PG_DATABASE: ${{ secrets.AIVEN_PG_DATABASE }}
      AIVEN_PG_USER: ${{ secrets.AIVEN_PG_USER }}
      PGPASSWORD: ${{ secrets.AIVEN_PG_PASSWORD }}
      PGSSLMODE: require

      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto

      BACKUP_RETENTION_DAYS: ${{ vars.BACKUP_RETENTION_DAYS || '7' }}
      POSTGRESQL_CLIENT_MAJOR: "17"

      OTEL_EXPORTER_OTLP_ENDPOINT: ${{ secrets.GRAFANA_OTLP_ENDPOINT }}
      OTEL_EXPORTER_OTLP_HEADERS: ${{ secrets.GRAFANA_OTLP_HEADERS }}
      OTEL_EXPORTER_OTLP_TIMEOUT: "5"
      OTEL_SERVICE_VERSION: ${{ github.sha }}
      OTEL_JOB_NAME: backup-postgresql
      OTEL_WORKER_NAME: github-actions

    steps:
      - name: Obter codigo do repositorio
        uses: actions/checkout@v4

      - name: Preparar Python para OpenTelemetry
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-observability.txt

      - name: Instalar dependencias de observabilidade
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${OTEL_EXPORTER_OTLP_ENDPOINT:-}" && -n "${OTEL_EXPORTER_OTLP_HEADERS:-}" ]]; then
            python3 -m pip install \
              --disable-pip-version-check \
              --requirement requirements-observability.txt
          else
            echo "Grafana nao configurado; dependencias OTLP nao sao necessarias."
          fi

      - name: Testar configuracao de observabilidade
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/test_observability.sh
          if python3 -c 'import opentelemetry.sdk, opentelemetry.exporter.otlp.proto.http' >/dev/null 2>&1; then
            python3 scripts/test_otel_export.py
          else
            echo "Teste integrado OTLP ignorado: dependencias opcionais nao instaladas."
          fi

      - name: Preparar cliente PostgreSQL e verificar AWS CLI
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends postgresql-common ca-certificates
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install --yes --no-install-recommends "postgresql-client-${POSTGRESQL_CLIENT_MAJOR}"

          postgresql_bin="/usr/lib/postgresql/${POSTGRESQL_CLIENT_MAJOR}/bin"
          [[ -x "${postgresql_bin}/pg_dump" ]] || {
            echo "::error::pg_dump ${POSTGRESQL_CLIENT_MAJOR} nao foi instalado corretamente."
            exit 1
          }

          echo "$postgresql_bin" >> "$GITHUB_PATH"
          export PATH="${postgresql_bin}:${PATH}"

          pg_dump --version
          pg_restore --version
          command -v aws >/dev/null 2>&1 || {
            echo "::error::AWS CLI nao esta disponivel no runner."
            exit 1
          }
          aws --version

      - name: Validar configuracoes obrigatorias
        shell: bash
        run: |
          set -euo pipefail

          required_variables=(
            AIVEN_PG_HOST
            AIVEN_PG_PORT
            AIVEN_PG_DATABASE
            AIVEN_PG_USER
            PGPASSWORD
            R2_ACCESS_KEY_ID
            R2_SECRET_ACCESS_KEY
            R2_ENDPOINT
            R2_BUCKET_NAME
          )

          for variable_name in "${required_variables[@]}"; do
            if [[ -z "${!variable_name:-}" ]]; then
              echo "::error::Configuracao obrigatoria ausente: ${variable_name}"
              exit 1
            fi
          done

          echo "Configuracoes obrigatorias presentes. Os valores permanecem protegidos."

          if [[ -n "${OTEL_EXPORTER_OTLP_ENDPOINT:-}" && -n "${OTEL_EXPORTER_OTLP_HEADERS:-}" ]]; then
            bash scripts/otel_log.sh INFO \
              "Exportacao de logs OTLP habilitada" \
              observability-config success
          elif [[ -n "${OTEL_EXPORTER_OTLP_ENDPOINT:-}" || -n "${OTEL_EXPORTER_OTLP_HEADERS:-}" ]]; then
            bash scripts/otel_log.sh WARN \
              "Configuracao OTLP incompleta; os logs permanecerao somente no console" \
              observability-config disabled
          else
            bash scripts/otel_log.sh INFO \
              "Exportacao OTLP nao configurada; os logs permanecerao somente no console" \
              observability-config disabled
          fi

      - name: Definir nome do backup
        shell: bash
        run: |
          set -euo pipefail
          timestamp="$(TZ=America/Sao_Paulo date +'%Y-%m-%d_%H-%M-%S')"
          backup_name="astro_${timestamp}.dump"
          backup_file="${RUNNER_TEMP}/${backup_name}"
          object_key="postgresql/${backup_name}"

          {
            echo "BACKUP_NAME=${backup_name}"
            echo "BACKUP_FILE=${backup_file}"
            echo "BACKUP_OBJECT_KEY=${object_key}"
          } >> "$GITHUB_ENV"

          bash scripts/otel_log.sh INFO \
            "Inicio do backup em $(TZ=America/Sao_Paulo date +'%Y-%m-%d %H:%M:%S %Z'); arquivo ${backup_name}" \
            backup running

      - name: Gerar backup logico
        shell: bash
        run: |
          set -euo pipefail

          started_at_ms="$(date +%s%3N)"
          if ! pg_dump \
              --host="$AIVEN_PG_HOST" \
              --port="$AIVEN_PG_PORT" \
              --username="$AIVEN_PG_USER" \
              --dbname="$AIVEN_PG_DATABASE" \
              --format=custom \
              --no-password \
              --file="$BACKUP_FILE"; then
            bash scripts/otel_log.sh ERROR "pg_dump falhou" pg-dump error
            exit 1
          fi

          [[ -f "$BACKUP_FILE" ]] || {
            bash scripts/otel_log.sh ERROR \
              "O pg_dump terminou sem criar o arquivo de backup" \
              pg-dump error
            exit 1
          }

          [[ -s "$BACKUP_FILE" ]] || {
            bash scripts/otel_log.sh ERROR \
              "O pg_dump criou um arquivo vazio" \
              pg-dump error
            exit 1
          }

          backup_size_bytes="$(stat --format='%s' "$BACKUP_FILE")"
          backup_size_human="$(du --human-readable "$BACKUP_FILE" | cut -f1)"
          duration_ms="$(( $(date +%s%3N) - started_at_ms ))"
          bash scripts/otel_log.sh INFO \
            "pg_dump concluido; tamanho ${backup_size_human} (${backup_size_bytes} bytes)" \
            pg-dump success "$duration_ms"

      - name: Validar integridade do arquivo
        shell: bash
        run: |
          set -euo pipefail
          if ! pg_restore --list "$BACKUP_FILE" >/dev/null; then
            bash scripts/otel_log.sh ERROR \
              "O arquivo nao foi reconhecido como PostgreSQL custom dump" \
              backup-validation error
            exit 1
          fi
          bash scripts/otel_log.sh INFO \
            "Arquivo reconhecido pelo pg_restore como PostgreSQL custom dump" \
            backup-validation success

      - name: Enviar backup ao Cloudflare R2
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/upload_backup.sh "$BACKUP_FILE" "$BACKUP_OBJECT_KEY"

      - name: Aplicar politica de retencao
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/apply_retention.sh "$BACKUP_OBJECT_KEY"

      - name: Registrar resultado
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/otel_log.sh INFO \
            "Backup concluido; objeto ${BACKUP_OBJECT_KEY}; horario $(TZ=America/Sao_Paulo date +'%Y-%m-%d %H:%M:%S %Z')" \
            backup success

      - name: Registrar falha do job
        if: failure()
        continue-on-error: true
        shell: bash
        run: |
          if [[ -f scripts/otel_log.sh ]]; then
            bash scripts/otel_log.sh ERROR \
              "Job de backup interrompido com falha; consulte o log do GitHub Actions" \
              backup error
          fi

      - name: Remover arquivo temporario do runner
        if: always()
        shell: bash
        run: |
          if [[ -n "${BACKUP_FILE:-}" && -f "$BACKUP_FILE" ]]; then
            rm -- "$BACKUP_FILE"
          fi
